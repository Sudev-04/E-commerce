# Render Blueprint for the IndiBazaar backend (Express API).
# Render → New → Blueprint → select this repo. You'll be asked for JWT_SECRET:
# use the same value as JWT_SECRET in the Vercel (frontend) project.
services:
  - type: web
    name: northlane-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://indibazaar.vercel.app
      - key: JWT_SECRET
        sync: false
      # MongoDB Atlas connection link; set it in the Render dashboard
      - key: MONGODB_URI
        sync: false
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Private admin password; set it in the Render dashboard (Environment)
      - key: ADMIN_PASSWORD
        sync: false
