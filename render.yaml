# Render Blueprint for the ShopNext backend (Express API).
# Render → New → Blueprint → select this repo. You'll be asked for JWT_SECRET:
# use the same value as JWT_SECRET in the Vercel (frontend) project.
services:
  - type: web
    name: shopnext-online-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://shopnext-online.vercel.app
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        generateValue: true
